<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaSoft — Panel de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7FBFF; --panel:#FFFFFF; --border:#D7E8F2;
    --celeste:#2E9FE0; --celeste-dark:#1C7CB8; --celeste-tint:#EAF6FD;
    --text:#16324A; --muted:#5B7A90; --muted-2:#8FA9BB;
    --amber:#F2A93B; --amber-tint:#FDF3E3; --red:#D1495B; --red-tint:#FCEBEC;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Poppins', sans-serif; font-size:16px; min-height:100vh; padding:30px 20px 60px; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .wrap{ max-width:980px; margin:0 auto; }

  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .brand .mark{ width:44px; height:44px; border-radius:12px; background:var(--celeste); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:19px; }
  .brand .name{ font-weight:700; font-size:20px; }
  .brand .tagline{ font-size:12.5px; color:var(--muted); }

  h1{ font-size:24px; font-weight:700; margin:0 0 18px; }

  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab{ font-family:'Poppins',sans-serif; font-weight:600; font-size:14px; padding:10px 18px; border-radius:10px; border:1.5px solid var(--border); background:#fff; color:var(--muted); cursor:pointer; }
  .tab.active{ border-color:var(--celeste); color:var(--celeste-dark); background:var(--celeste-tint); }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px; box-shadow:0 2px 10px rgba(46,159,224,0.06); margin-bottom:18px; }

  .stats{ display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:150px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
  .stat .label{ font-size:11px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; font-weight:600; }
  .stat .value{ font-size:24px; font-weight:700; margin-top:6px; color:var(--celeste-dark); }

  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-size:11.5px; letter-spacing:0.5px; color:var(--muted); text-transform:uppercase; padding:10px 12px; border-bottom:2px solid var(--border); font-weight:600; }
  tbody tr{ border-bottom:1px solid var(--border); }
  td{ padding:12px; font-size:14.5px; vertical-align:middle; }
  .badge{ font-size:11px; font-weight:700; letter-spacing:0.5px; padding:4px 10px; border-radius:20px; white-space:nowrap; }
  .badge.conf{ background:var(--celeste-tint); color:var(--celeste-dark); }
  .badge.pend{ background:var(--amber-tint); color:#9A6A0F; }
  .badge.canc{ background:var(--red-tint); color:var(--red); }
  button.act{ font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; border:1.5px solid var(--red); color:var(--red); background:#fff; padding:6px 12px; border-radius:8px; cursor:pointer; }
  .empty{ text-align:center; padding:40px 14px; color:var(--muted-2); font-size:14px; }

  .filters{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filters button{ font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; border:1.5px solid var(--border); color:var(--muted); background:#fff; padding:8px 14px; border-radius:8px; cursor:pointer; }
  .filters button.active{ border-color:var(--celeste); color:var(--celeste-dark); background:var(--celeste-tint); }

  /* navegación de fecha libre (horarios) y de semana (reservas) */
  .datenav, .weeknav{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .weeknav-label{ font-weight:700; font-size:14.5px; min-width:180px; }
  input[type=date]{ border:1.5px solid var(--border); border-radius:10px; padding:9px 12px; font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--text); outline:none; background:#fff; }
  input[type=date]:focus{ border-color:var(--celeste); }

  /* planilla semanal */
  .gridtable{ width:100%; border-collapse:collapse; min-width:760px; }
  .gridtable thead th{ background:#fff; padding:10px 6px; text-align:center; font-size:12px; border:1px solid var(--border); }
  .gridtable thead th .d{ font-weight:700; color:var(--text); display:block; font-size:13px; }
  .gridtable thead th .n{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--muted); }
  .timecol{ background:#fff; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); text-align:right; padding:8px 10px; white-space:nowrap; border:1px solid var(--border); }
  .gridcell{ height:46px; vertical-align:middle; padding:4px; border:1px solid var(--border); min-width:95px; }
  .gridcell.closed{ background:repeating-linear-gradient(45deg, #F2F5F8, #F2F5F8 6px, #E7EDF2 6px, #E7EDF2 12px); }
  .gridcell.free{ background:#fff; }
  .gridcell .chip{ display:block; border-radius:7px; padding:5px 7px; font-size:11.5px; line-height:1.3; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gridcell .chip.conf{ background:var(--celeste-tint); color:var(--celeste-dark); border:1px solid var(--celeste); }
  .gridcell .chip.pend{ background:var(--amber-tint); color:#9A6A0F; border:1px solid var(--amber); }
  .gridcell .chip.canc{ background:var(--red-tint); color:var(--red); border:1px dashed var(--red); text-decoration:line-through; }
  .gridcell .chip.cont{ opacity:0.75; font-size:10.5px; }
  #detailPanel{ border:1.5px solid var(--celeste); }

  /* schedule manager */
  .daypicker{ display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; padding-bottom:6px; }
  .daybtn{ flex:0 0 auto; text-align:center; padding:10px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:13px; cursor:pointer; font-family:'JetBrains Mono',monospace; white-space:nowrap; }
  .daybtn.selected{ border-color:var(--celeste); color:var(--celeste-dark); background:var(--celeste-tint); font-weight:700; }
  .daybtn .count{ display:inline-block; margin-left:5px; background:var(--celeste); color:#fff; font-size:10px; font-weight:700; border-radius:8px; padding:1px 6px; }
  .daybtn.selected .count{ background:var(--celeste-dark); }
  .daybtn[data-all="1"]{ font-family:'Poppins',sans-serif; font-weight:600; }

  .slotlist{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  .slotchip{ display:flex; align-items:center; gap:8px; border:1.5px solid var(--border); border-radius:20px; padding:8px 8px 8px 16px; font-family:'JetBrains Mono',monospace; font-size:14px; }
  .slotchip button{ width:22px; height:22px; border-radius:50%; border:none; background:var(--red-tint); color:var(--red); font-size:13px; cursor:pointer; line-height:1; }
  .status-closed{ background:var(--red-tint); color:var(--red); padding:14px 16px; border-radius:10px; font-weight:600; margin-bottom:16px; }

  .addrow{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:8px; }
  .addrow label{ font-size:11px; letter-spacing:0.5px; color:var(--muted); text-transform:uppercase; display:block; margin-bottom:6px; font-weight:600; }
  .addrow input{ border:1.5px solid var(--border); border-radius:10px; padding:11px 12px; font-family:'JetBrains Mono',monospace; font-size:14px; outline:none; }
  .addrow input:focus{ border-color:var(--celeste); }

  button.btn{ font-family:'Poppins',sans-serif; font-weight:600; font-size:14px; cursor:pointer; border:1.5px solid var(--celeste); color:var(--celeste-dark); background:#fff; padding:11px 18px; border-radius:10px; }
  button.btn.primary{ background:var(--celeste); color:#fff; }
  button.btn.primary:hover{ background:var(--celeste-dark); }
  button.btn.danger{ border-color:var(--red); color:var(--red); }
  button.btn.danger:hover{ background:var(--red-tint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="assets/logo_icon.png" alt="NovaSoft" style="height:46px; width:auto;">
    <div><div class="name">NovaSoft</div><div class="tagline">Panel de administración</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="reservas">Reservas</div>
    <div class="tab" data-tab="horarios">Horarios</div>
  </div>

  <!-- ===== TAB RESERVAS ===== -->
  <div id="tabReservas">
    <div class="stats">
      <div class="stat"><div class="label">Total reservas</div><div class="value" id="statTotal">0</div></div>
      <div class="stat"><div class="label">Confirmadas</div><div class="value" id="statConf">0</div></div>
      <div class="stat"><div class="label">Abonos recibidos</div><div class="value" id="statSum">$0</div></div>
    </div>

    <div class="card">
      <div class="weeknav">
        <button class="btn" id="weekPrev">◀ Semana anterior</button>
        <div class="weeknav-label" id="weekLabel"></div>
        <button class="btn" id="weekNext">Semana siguiente ▶</button>
        <input type="date" id="weekJump" style="margin-left:auto;">
      </div>

      <div class="filters">
        <button class="active" data-f="all">Todas</button>
        <button data-f="confirmada">Confirmadas</button>
        <button data-f="pendiente_pago">Pendientes</button>
        <button data-f="cancelada">Canceladas</button>
      </div>

      <div style="overflow-x:auto;">
        <table class="gridtable" id="weekGrid"></table>
      </div>
    </div>

    <div class="card" id="detailPanel" style="display:none;"></div>
  </div>

  <!-- ===== TAB HORARIOS ===== -->
  <div id="tabHorarios" style="display:none;">
    <div class="card">
      <h2 style="font-size:17px; margin:0 0 4px;">Gestión de horarios</h2>
      <div style="font-size:13.5px; color:var(--muted); margin-bottom:18px;">Elige un día para bloquearlo completo, o agregar/quitar horas puntuales.</div>

      <div class="datenav">
        <button class="btn" id="schedPrevDay">◀</button>
        <input type="date" id="schedDateInput">
        <button class="btn" id="schedNextDay">▶</button>
        <div class="weeknav-label" id="schedDateLabel"></div>
      </div>

      <div id="schedStatus"></div>

      <div id="schedSlots" class="slotlist"></div>

      <div class="addrow">
        <div>
          <label>Agregar hora</label>
          <input type="text" id="newSlotTime" placeholder="14:30" style="width:100px;">
        </div>
        <button class="btn primary" id="btnAddSlot">+ Agregar</button>
        <button class="btn danger" id="btnCloseDay">Bloquear día completo</button>
        <button class="btn" id="btnResetDay">Restablecer horario normal</button>
      </div>
    </div>
  </div>
</div>

<script>
let bookings = [];
let filter = 'all';

function fmtMoney(n){ return "$" + n.toLocaleString('es-CL'); }
function toMinutes(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function toHHMM(mins){ return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`; }
function isoDate(d){ return d.toISOString().slice(0,10); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtDay(d){
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'], meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
}

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tabReservas').style.display = t.dataset.tab==='reservas' ? 'block' : 'none';
    document.getElementById('tabHorarios').style.display = t.dataset.tab==='horarios' ? 'block' : 'none';
    if(t.dataset.tab==='reservas') loadWeek(); // refresca por si cambiaste horarios mientras tanto
  });
});

// ================= RESERVAS: planilla semanal =================
const ROW_START_MIN = 8*60;   // 08:00
const ROW_END_MIN   = 21*60;  // hasta 20:00 (última fila)
const ROW_STEP      = 60;

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() + (day===0 ? -6 : 1-day));
  date.setHours(0,0,0,0);
  return date;
}
function fmtWeekRange(start){
  const end = addDays(start,6);
  const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${start.getDate()} ${meses[start.getMonth()]} — ${end.getDate()} ${meses[end.getMonth()]} ${end.getFullYear()}`;
}
function fmtShortDay(d){ return ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()]; }

let weekStart = getMonday(new Date());
let weekSchedule = {};

async function loadWeek(){
  document.getElementById('weekLabel').textContent = fmtWeekRange(weekStart);
  document.getElementById('weekJump').value = isoDate(weekStart);
  const days = [...Array(7)].map((_,i)=>addDays(weekStart,i));
  weekSchedule = {};
  await Promise.all(days.map(async d => {
    const ds = isoDate(d);
    const res = await fetch(`/api/admin/schedule?date=${ds}`);
    weekSchedule[ds] = await res.json();
  }));
  renderWeekGrid();
}

function renderWeekGrid(){
  const days = [...Array(7)].map((_,i)=>addDays(weekStart,i));
  const dayStrs = days.map(isoDate);

  const rowSet = new Set();
  for(let m=ROW_START_MIN; m<ROW_END_MIN; m+=ROW_STEP) rowSet.add(toHHMM(m));
  dayStrs.forEach(ds => (weekSchedule[ds]?.slots || []).forEach(t => rowSet.add(t)));
  bookings.filter(b => dayStrs.includes(b.date)).forEach(b => rowSet.add(b.time));
  const rows = [...rowSet].sort();

  const filtered = filter==='all' ? bookings.filter(b=>b.status!=='cancelada') : bookings.filter(b=>b.status===filter);

  let html = '<thead><tr><th></th>' + days.map(d =>
    `<th><span class="d">${fmtShortDay(d)}</span><span class="n">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</span></th>`
  ).join('') + '</tr></thead><tbody>';

  rows.forEach(rowTime => {
    html += `<tr><td class="timecol">${rowTime}</td>`;
    dayStrs.forEach(ds => {
      const sched = weekSchedule[ds];
      const isClosedDay = !sched || sched.closed;
      const isOpenSlot = sched && sched.slots && sched.slots.includes(rowTime);

      const occupying = filtered.find(b => {
        if(b.date !== ds) return false;
        const start = toMinutes(b.time);
        const end = start + b.durationMin;
        const cellMin = toMinutes(rowTime);
        return cellMin >= start && cellMin < end;
      });

      let cellClass = 'gridcell ';
      let inner = '';
      if(occupying){
        const isStart = occupying.time === rowTime;
        const cls = occupying.status==='confirmada'?'conf':occupying.status==='cancelada'?'canc':'pend';
        inner = `<div class="chip ${cls}${isStart?'':' cont'}" onclick="showDetail(${occupying.id})">${isStart ? occupying.name : '↳ '+occupying.name}</div>`;
      } else if(isClosedDay || !isOpenSlot){
        cellClass += 'closed';
      } else {
        cellClass += 'free';
      }
      html += `<td class="${cellClass}">${inner}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody>';
  document.getElementById('weekGrid').innerHTML = html;
}

function showDetail(id){
  const b = bookings.find(x=>x.id===id);
  if(!b) return;
  const cls = b.status==='confirmada'?'conf':b.status==='cancelada'?'canc':'pend';
  const txt = b.status==='confirmada'?'CONFIRMADA':b.status==='cancelada'?'CANCELADA':'PENDIENTE';
  const panel = document.getElementById('detailPanel');
  panel.style.display = 'block';
  panel.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
      <div>
        <div style="font-weight:700; font-size:15px;">${b.name}</div>
        <div class="mono" style="color:var(--muted-2); font-size:12.5px; margin-top:2px;">${b.phone}</div>
      </div>
      <span class="badge ${cls}">${txt}</span>
    </div>
    <div style="margin-top:12px; font-size:13.5px; color:var(--muted); line-height:1.8;">
      ${b.serviceName}${b.people>1 ? ` · ${b.people} personas` : ''}<br>
      ${b.date} · ${b.time}<br>
      Abono: ${fmtMoney(b.deposit)}
    </div>
    ${b.status!=='cancelada' ? `<button class="act" style="margin-top:12px;" onclick="cancelBooking(${b.id})">Cancelar reserva</button>` : ''}
  `;
}

async function cancelBooking(id){
  await fetch(`/api/bookings/${id}/cancel`, { method:'POST' });
  document.getElementById('detailPanel').style.display = 'none';
  loadBookings();
}

async function loadBookings(){
  const res = await fetch('/api/bookings');
  bookings = await res.json();
  document.getElementById('statTotal').textContent = bookings.length;
  document.getElementById('statConf').textContent = bookings.filter(b=>b.status==='confirmada').length;
  document.getElementById('statSum').textContent = fmtMoney(bookings.filter(b=>b.status==='confirmada').reduce((s,b)=>s+b.deposit,0));
  renderWeekGrid();
}

document.getElementById('weekPrev').addEventListener('click', () => { weekStart = addDays(weekStart,-7); loadWeek(); });
document.getElementById('weekNext').addEventListener('click', () => { weekStart = addDays(weekStart,7); loadWeek(); });
document.getElementById('weekJump').addEventListener('change', e => { weekStart = getMonday(new Date(e.target.value+'T00:00:00')); loadWeek(); });

document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); filter = btn.dataset.f; renderWeekGrid();
  });
});

// ================= HORARIOS: fecha libre =================
let schedDate = isoDate(new Date());

function setSchedDate(dateStr){
  schedDate = dateStr;
  document.getElementById('schedDateInput').value = dateStr;
  document.getElementById('schedDateLabel').textContent = fmtDay(new Date(dateStr+'T00:00:00'));
  loadSchedule();
}

async function loadSchedule(){
  const res = await fetch(`/api/admin/schedule?date=${schedDate}`);
  renderSchedule(await res.json());
}

function renderSchedule(data){
  const statusBox = document.getElementById('schedStatus');
  const slotsBox = document.getElementById('schedSlots');
  if(data.closed){
    statusBox.innerHTML = '<div class="status-closed">Este día está bloqueado — no aparece disponible para reservar.</div>';
    slotsBox.innerHTML = '';
    return;
  }
  statusBox.innerHTML = '';
  if(data.slots.length === 0){
    slotsBox.innerHTML = '<div style="color:var(--muted-2); font-size:14px;">Sin horas configuradas este día.</div>';
    return;
  }
  slotsBox.innerHTML = '';
  data.slots.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'slotchip';
    chip.innerHTML = `<span>${t}</span>`;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.onclick = () => removeSlot(t);
    chip.appendChild(btn);
    slotsBox.appendChild(chip);
  });
}

async function removeSlot(time){
  const res = await fetch('/api/admin/schedule/remove-slot', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({date:schedDate, time}) });
  renderSchedule(await res.json());
}

document.getElementById('btnAddSlot').addEventListener('click', async () => {
  const time = document.getElementById('newSlotTime').value.trim();
  if(!/^\d{1,2}:\d{2}$/.test(time)){ alert('Ingresa una hora válida, ej: 14:30'); return; }
  const res = await fetch('/api/admin/schedule/add-slot', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({date:schedDate, time}) });
  document.getElementById('newSlotTime').value = '';
  renderSchedule(await res.json());
});

document.getElementById('btnCloseDay').addEventListener('click', async () => {
  const res = await fetch('/api/admin/schedule/close', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({date:schedDate}) });
  renderSchedule(await res.json());
});

document.getElementById('btnResetDay').addEventListener('click', async () => {
  const res = await fetch('/api/admin/schedule/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({date:schedDate}) });
  renderSchedule(await res.json());
});

document.getElementById('schedDateInput').addEventListener('change', e => setSchedDate(e.target.value));
document.getElementById('schedPrevDay').addEventListener('click', () => {
  const d = new Date(schedDate+'T00:00:00'); d.setDate(d.getDate()-1); setSchedDate(isoDate(d));
});
document.getElementById('schedNextDay').addEventListener('click', () => {
  const d = new Date(schedDate+'T00:00:00'); d.setDate(d.getDate()+1); setSchedDate(isoDate(d));
});

// ================= Init =================
setSchedDate(isoDate(new Date()));
loadWeek();
loadBookings();
setInterval(loadBookings, 6000);
</script>
</body>
</html>
